      <rect x="-3.8" y="-1.1" width="7.6" height="2.2" rx="1.1" fill="#0b4a24" opacity=".55"/>
    </g>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#felt)"/>
  <g transform="rotate(-12 32 50)">
    <rect x="13" y="25" width="36" height="48" rx="5" fill="#1e40af"/>
    <rect x="13" y="22" width="36" height="48" rx="5" fill="#fffaf0"/>
