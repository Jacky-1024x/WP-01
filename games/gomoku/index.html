<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>五子棋 · H5 游戏合集</title>
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="游戏合集">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="gomoku.css">
  <script type="module" src="gomoku.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../" aria-label="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1>五子棋</h1>
      <button class="icon-btn" data-sound-toggle aria-label="音效开关"></button>
      <button class="icon-btn" id="helpBtn" aria-label="玩法说明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="status-bar">
      <div class="player" id="playerYou"><i class="stone" id="youStone"></i>你</div>
      <div class="status" id="status" aria-live="polite">轮到你落子</div>
      <div class="player" id="playerAi">AI<i class="stone" id="aiStone"></i></div>
    </div>

    <main class="board-wrap" id="boardWrap">
      <canvas id="board" aria-label="棋盘"></canvas>
    </main>

    <div class="panel">
      <div class="segmented" id="levelSelect" role="group" aria-label="难度">
        <button data-level="easy">简单</button>
        <button data-level="normal">普通</button>
        <button data-level="hard">困难</button>
      </div>
      <div class="segmented" id="sideSelect" role="group" aria-label="执子">
        <button data-side="1">执黑先手</button>
        <button data-side="2">执白后手</button>
      </div>
      <div class="actions-row">
        <button class="btn" id="undoBtn">↶ 悔棋</button>
        <button class="btn" id="confirmBtn" aria-pressed="false">确认落子</button>
        <button class="btn primary" id="restartBtn">重新开始</button>
      </div>
      <div class="record-line" id="record"></div>
    </div>
  </div>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-card">
      <h2 id="resultTitle"></h2>
      <p id="resultDetail"></p>
      <div class="actions">
        <button class="btn" id="resultClose">查看棋盘</button>
        <button class="btn primary" id="resultAgain">再来一局</button>
      </div>
    </div>
  </div>

  <div class="modal" id="helpModal" hidden>
    <div class="modal-card help">
      <h2>玩法说明</h2>
      <ul>
        <li>15×15 棋盘，黑棋先行，横、竖、斜任意方向先连成五子者获胜（无禁手）。</li>
        <li>点按交叉点落子。开启「确认落子」后，第一次点按显示预览，再点同一位置才真正落子，防止误触。</li>
        <li>悔棋会撤回 AI 和你的最后一手。</li>
        <li>切换执黑/执白会开始新的一局；难度切换在 AI 下一手生效。</li>
        <li>红点标记最后一手，获胜连线会高亮显示。</li>
      </ul>
      <div class="actions"><button class="btn primary" data-close>知道了</button></div>
    </div>
  </div>
</body>
</html>
