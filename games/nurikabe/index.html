<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>数墙 · H5 游戏合集</title>
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="游戏合集">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="nurikabe.css">
  <script type="module" src="nurikabe.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../" aria-label="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="icon-btn" id="restartBtn" aria-label="重新开始本题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>数墙</h1>
      <button class="icon-btn" data-sound-toggle aria-label="音效开关"></button>
      <button class="icon-btn" id="helpBtn" aria-label="玩法说明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="controls-top">
      <div class="segmented" id="levelSelect" role="group" aria-label="难度">
        <button data-level="easy">5×5</button>
        <button data-level="medium">7×7</button>
        <button data-level="hard">10×10</button>
      </div>
      <div class="status">
        <span class="chip" id="puzzleNo" aria-label="题号">#1</span>
        <span class="chip progress-chip" aria-label="黑格进度">
          <i class="swatch" aria-hidden="true"></i><span id="progress">0 / 0</span>
        </span>
        <span class="chip" aria-label="用时">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12V7.5M12 12h3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="timer">00:00</span>
        </span>
      </div>
    </div>

    <main class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="grid" aria-label="棋盘"></div>
    </main>

    <div class="controls">
      <button class="tool" id="undoBtn" data-sfx="none" aria-label="撤销">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>撤销</span>
      </button>
      <button class="tool" id="redoBtn" data-sfx="none" aria-label="重做">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7l4.5 4.5L15 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 11.5h-9a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>重做</span>
      </button>
      <button class="tool" id="clearBtn" aria-label="清空">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>清空</span>
      </button>
      <button class="tool" id="nextBtn" aria-label="换一题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h11l-3-3M20 17H9l3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>换一题</span>
      </button>
    </div>
  </div>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-card">
      <div class="result-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#22c55e"/><path d="M14 24.5l7 7 13-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>完成！</h2>
      <p id="resultDetail"></p>
      <div class="record" id="resultRecord" hidden>新纪录！</div>
      <div class="stats" id="resultStats"></div>
      <div class="actions">
        <button class="btn" id="resultClose">查看棋盘</button>
        <button class="btn primary" id="resultAgain">再来一局</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal" hidden>
    <div class="modal-card">
      <h2>放弃本题？</h2>
      <p id="confirmText"></p>
      <div class="actions">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="helpModal" hidden>
    <div class="modal-card help">
      <h2>玩法说明</h2>
      <ul>
        <li>把一些格子涂黑当作<b>墙</b>，所有黑格要上下左右连成<b>一整片</b>。</li>
        <li>墙里不能出现 <b>2×2</b> 的黑块。</li>
        <li>剩下的白格组成一个个<b>岛</b>：每个岛只有一个数字，岛的格子数等于这个数字。</li>
        <li>轻点格子在「空 → 黑 → 白点 → 空」之间切换；按住<b>拖动</b>可以连续涂。白点只是记号，表示“这里一定是白格”。</li>
        <li>红色表示肯定有错：2×2 黑块、岛屿超数、一个岛有两个数字、岛被墙围得太小。</li>
        <li>电脑上：右键切换白点；方向键移动，空格切换，<b>X</b> 涂黑，<b>.</b> 白点，⌘/Ctrl + Z 撤销。</li>
      </ul>
      <div class="setting">
        <span>违规提示</span>
        <div class="segmented" id="hintSelect" role="group" aria-label="违规提示">
          <button data-hint="off">关</button>
          <button data-hint="on">开</button>
        </div>
      </div>
      <div class="actions"><button class="btn primary" data-close>知道了</button></div>
    </div>
  </div>
</body>
</html>
