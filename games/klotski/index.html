<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>数字华容道 · H5 游戏合集</title>
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="游戏合集">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="klotski.css">
  <script type="module" src="klotski.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../" aria-label="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1>数字华容道</h1>
      <button class="icon-btn" data-sound-toggle aria-label="音效开关"></button>
      <button class="icon-btn" id="helpBtn" aria-label="玩法说明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="controls-top">
      <div class="segmented" id="sizeSelect" role="group" aria-label="难度">
        <button data-size="3">3×3</button>
        <button data-size="4">4×4</button>
        <button data-size="5">5×5</button>
        <button data-size="6">6×6</button>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">用时</span><span class="value" id="time">00:00.0</span></div>
        <div class="stat"><span class="label">步数</span><span class="value" id="moves">0</span></div>
        <div class="stat"><span class="label">最佳</span><span class="value small" id="best">—</span></div>
      </div>
    </div>

    <main class="board-wrap" id="boardWrap">
      <div class="board" id="board" aria-label="棋盘"></div>
    </main>

    <div class="controls-bottom">
      <button class="btn primary" id="shuffleBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h3.5c2 0 3.2 1 4.3 2.8l.4.7M4 17h3.5c2 0 3.2-1 4.3-2.8l2.4-4.4C15.3 8 16.5 7 18.5 7H20m0 0-3-3m3 3-3 3M14.6 15c1 1.4 2.1 2 3.9 2H20m0 0-3-3m3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        重新打乱
      </button>
    </div>
  </div>

  <div class="modal" id="winModal" hidden>
    <div class="modal-card">
      <h2>🎉 完成！</h2>
      <p id="winDetail"></p>
      <p id="winRecord" class="record"></p>
      <div class="actions">
        <button class="btn" id="winClose">查看棋盘</button>
        <button class="btn primary" id="winAgain">再来一局</button>
      </div>
    </div>
  </div>

  <div class="modal" id="helpModal" hidden>
    <div class="modal-card help">
      <h2>玩法说明</h2>
      <ul>
        <li>把数字方块按 1、2、3… 的顺序排好，空格留在右下角即完成。</li>
        <li>点击与空格同行或同列的方块，可把整排方块推向空格。</li>
        <li>也可以在棋盘上滑动，把空格旁边的方块推过去。</li>
        <li>第一次移动时开始计时；每移动一个方块算一步。</li>
        <li>每种难度分别记录最短用时和最少步数。</li>
      </ul>
      <div class="actions"><button class="btn primary" data-close>知道了</button></div>
    </div>
  </div>
</body>
</html>
