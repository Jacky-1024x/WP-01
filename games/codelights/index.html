<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>密码灯 · H5 游戏合集</title>
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="游戏合集">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="codelights.css">
  <script type="module" src="codelights.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../" aria-label="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="icon-btn" id="restartBtn" aria-label="重新开始">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>密码灯</h1>
      <button class="icon-btn" data-sound-toggle aria-label="音效开关"></button>
      <button class="icon-btn" id="helpBtn" aria-label="玩法说明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="controls-top">
      <div class="segmented" id="modeSelect" role="group" aria-label="模式">
        <button data-mode="simple">简单</button>
        <button data-mode="advanced">进阶</button>
      </div>
      <div class="segmented" id="colorSelect" role="group" aria-label="颜色数量">
        <button data-colors="4">4 色</button>
        <button data-colors="5">5 色</button>
        <button data-colors="6">6 色</button>
        <button data-colors="7">7 色</button>
      </div>
    </div>

    <main class="board-wrap" id="boardWrap">
      <div class="board" id="board" aria-label="棋盘"></div>
    </main>

    <div class="controls">
      <div class="controls-row">
        <button class="ctrl-btn" id="nextBtn" data-sfx="none" aria-label="下一盏">
          <span class="ctrl-label">下一盏
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="slot-marks" id="slotMarks"></span>
        </button>
        <button class="ctrl-btn" id="colorBtn" data-sfx="none" aria-label="换色">
          <span class="ctrl-label">换色</span>
          <span class="color-marks" id="colorMarks"></span>
        </button>
      </div>
      <button class="btn primary ok-btn" id="okBtn" data-sfx="none">确定</button>
    </div>
  </div>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-card">
      <h2 id="resultTitle"></h2>
      <p id="resultDetail"></p>
      <div class="answer" id="resultAnswer"></div>
      <p id="resultStats" class="result-stats"></p>
      <div class="actions">
        <button class="btn" id="resultClose">查看棋盘</button>
        <button class="btn primary" id="resultAgain">再来一局</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal" hidden>
    <div class="modal-card">
      <h2>放弃本局？</h2>
      <p id="confirmText"></p>
      <div class="actions">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="helpModal" hidden>
    <div class="modal-card help">
      <h2>玩法说明</h2>
      <ul>
        <li>答案是 <span id="helpColors">4</span> 种颜色中的 4 种（不重复），7 次机会猜出颜色和顺序。颜色越多越难。</li>
        <li>「换色」改颜色，「下一盏」或点击灯切换选中。同一行颜色不能重复，撞色的灯会熄灭。</li>
        <li>4 盏全亮才能「确定」，确认后不能撤销。</li>
        <li><b class="fb-g">绿</b> 全对，<b class="fb-w">白</b> 颜色对位置错，<b>黑</b> 没有这个颜色。</li>
        <li>简单模式逐盏显示结果；进阶模式只显示数量。</li>
      </ul>
      <div class="actions"><button class="btn primary" data-close>知道了</button></div>
    </div>
  </div>
</body>
</html>
