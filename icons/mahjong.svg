    <rect x="46" y="20" width="36" height="48" rx="5" fill="#fffaf0"/>
    <use href="#dot" x="56" y="32" color="#1d4ed8"/>
    <use href="#dot" x="72" y="32" color="#15803d"/>
    <use href="#dot" x="64" y="44" color="#dc2626"/>
    <use href="#dot" x="56" y="56" color="#15803d"/>
    <use href="#dot" x="72" y="56" color="#1d4ed8"/>
