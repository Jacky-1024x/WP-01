<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/>
      <stop offset="1" stop-color="#0c4a2c"/>
    </linearGradient>
    <g id="dot">
      <circle r="6.5" fill="currentColor"/>
      <circle r="4.7" fill="#fffaf0"/>
      <circle r="3.3" fill="currentColor"/>
      <circle r="1.1" fill="#fffaf0"/>
    </g>
    <g id="stick">
