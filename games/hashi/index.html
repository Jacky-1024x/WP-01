<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>数桥 · H5 游戏合集</title>
  <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="游戏合集">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="hashi.css">
  <script type="module" src="hashi.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../" aria-label="返回主页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="icon-btn" id="restartBtn" aria-label="新题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>数桥</h1>
      <button class="icon-btn" data-sound-toggle aria-label="音效开关"></button>
      <button class="icon-btn" id="helpBtn" aria-label="玩法说明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.2" fill="currentColor"/></svg>
      </button>
    </header>

    <div class="controls-top">
      <div class="segmented" id="levelSelect" role="group" aria-label="难度">
        <button data-level="easy">简单</button>
        <button data-level="medium">中等</button>
        <button data-level="hard">困难</button>
        <button data-level="expert">专家</button>
      </div>
      <div class="status">
        <div class="pill" aria-label="已满足的岛">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8.3 12.2l2.5 2.5 4.9-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="islandsDone">0 / 0</span>
        </div>
        <div class="pill" aria-label="用时">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12V7.5M12 12h3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="timer">0:00</span>
        </div>
      </div>
    </div>

    <main class="board-wrap" id="boardWrap">
      <svg class="board" id="board" role="img" aria-label="数桥棋盘">
        <g class="dots" id="dotsLayer"></g>
        <g class="guides" id="guideLayer"></g>
        <g class="bridges" id="bridgeLayer"></g>
        <g class="islands" id="islandLayer"></g>
      </svg>
    </main>

    <div class="controls">
      <button class="tool" id="undoBtn">
        <span class="tool-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H6V4M6.5 7.5A7.5 7.5 0 1 1 5 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>撤销</span>
      </button>
      <button class="tool" id="clearBtn">
        <span class="tool-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>清空</span>
      </button>
      <button class="tool" id="newBtn">
        <span class="tool-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>新题</span>
      </button>
    </div>
  </div>

  <div class="modal" id="resultModal" hidden>
    <div class="modal-card">
      <div class="result-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="11" cy="24" r="8" fill="#22c55e"/><circle cx="37" cy="24" r="8" fill="#22c55e"/><path d="M19 21h10M19 27h10" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M7.5 24.3l2.3 2.3 4.3-4.6M33.5 24.3l2.3 2.3 4.3-4.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>全部连通！</h2>
      <p id="resultDetail"></p>
      <div class="record" id="resultRecord" hidden>新纪录！</div>
      <div class="stats" id="resultStats"></div>
      <div class="actions">
        <button class="btn" id="resultClose">查看棋盘</button>
        <button class="btn primary" id="resultAgain">下一题</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal" hidden>
    <div class="modal-card">
      <h2>放弃本题？</h2>
      <p id="confirmText"></p>
      <div class="actions">
        <button class="btn" data-close>取消</button>
        <button class="btn primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="helpModal" hidden>
    <div class="modal-card help">
      <h2>玩法说明</h2>
      <ul>
        <li>在带数字的「岛」之间水平或垂直地架桥，每个岛的桥数要等于它的数字。</li>
        <li>两个岛之间最多 2 座桥；桥不能交叉，也不能越过别的岛。</li>
        <li>所有岛最终要通过桥<b>连成一片</b>。桥数满足的岛会变绿，超出会变红。</li>
        <li><b>从一个岛拖向</b>相邻的岛即可架桥；也可以先点一个岛，再点它的邻岛。</li>
        <li>对同一对岛重复操作：1 座 → 2 座 → 拆除。直接点桥也可以切换。</li>
        <li>电脑上：方向键选岛，<b>Shift + 方向键</b>架桥，Ctrl/⌘ + Z 撤销。</li>
      </ul>
      <div class="actions"><button class="btn primary" data-close>知道了</button></div>
    </div>
  </div>
</body>
</html>
